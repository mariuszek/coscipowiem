<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyfrowe Zdrowie — Przewodnik po świadomym korzystaniu z technologii</title>
  <meta name="description" content="Zbiór badań, wytycznych WHO, literatury i praktycznych wskazówek dotyczących higieny cyfrowej i wychowania dzieci w erze ekranów.">

  <!-- Favicon placeholder with SVG data URI -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Reading Progress Bar -->
  <div class="reading-progress" id="progressBar" aria-hidden="true"></div>

  <!-- Mobile Top Navigation Bar -->
  <header class="mobile-header">
    <div class="mobile-brand">
      <span class="brand-icon" style="width: 32px; height: 32px; font-size: 1rem;" data-text="brand.icon"></span>
      <span data-text="brand.title"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <button class="nav-toggle" id="themeToggleMobile" data-aria-label="ui.themeToggleMobileLabel" style="width: 38px; height: 38px;">
        <svg id="themeIconMobile" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <button class="nav-toggle" id="navToggle" data-aria-label="ui.mobileMenuToggle" style="width: 38px; height: 38px;">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Dark Backdrop Overlay for Mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- Sidebar Navigation -->
  <aside class="nav-container" id="navContainer" data-aria-label="ui.navLabel">
    <div class="nav-brand">
      <div class="brand-icon" data-text="brand.icon"></div>
      <div>
        <div class="brand-title" data-text="brand.title"></div>
        <div class="brand-subtitle" data-text="brand.subtitle"></div>
      </div>
    </div>

    <div class="nav-section-label" data-text="navigation.sectionLabel"></div>
    <nav class="nav-links" id="navLinks"></nav>

    <div class="nav-footer">
      <button class="theme-toggle-btn" id="themeToggle" data-aria-label="ui.themeToggleLabel">
        <div class="theme-toggle-icon">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span id="themeText"></span>
        </div>
        <span style="font-size: 0.75rem; color: var(--text-subtle);" data-text="ui.themeToggle.change"></span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="container">

      <!-- Hero / Introduction -->
      <section class="hero-section" id="introduction">
        <div class="pill-badge">
          <span data-text="hero.badge.icon"></span>
          <span data-text="hero.badge.text"></span>
        </div>

        <h1 class="hero-title">
          <span data-text="hero.title"></span> <span class="hero-title-accent" data-text="hero.titleAccent"></span>
        </h1>
        <p class="lead" data-text="hero.lead"></p>

        <div class="stats-grid" id="heroStats"></div>

        <div class="quick-actions" id="heroActions"></div>

        <div class="callout" style="margin-top: 2.5rem;" data-callout="hero.callouts.0"></div>

        <div data-paragraphs="hero.introText"></div>

        <div class="callout" style="margin-top: 2rem;" data-callout="hero.callouts.1"></div>
      </section>

      <!-- Key Concepts -->
      <section class="section" id="key-concepts">
        <h2 data-text="keyConcepts.title"></h2>
        <p class="section-intro" data-text="keyConcepts.intro"></p>
        <div class="key-concepts-grid" id="conceptsGrid"></div>
      </section>

      <!-- WHO Guidelines -->
      <section class="section" id="who-guidelines">
        <h2 data-text="whoGuidelines.title"></h2>
        <p class="section-intro" data-text="whoGuidelines.intro"></p>

        <div class="callout" style="margin-bottom: 2.5rem;" data-callout="whoGuidelines.introCallout"></div>

        <div class="who-grid" id="whoGrid"></div>

        <div class="callout" style="margin-top: 2.5rem;" data-callout="whoGuidelines.notes"></div>

        <div style="margin-top: 2.5rem; padding: 1.75rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); border-left: 4px solid var(--accent);">
          <h3 style="margin-top: 0; margin-bottom: 0.75rem; font-size: 1.125rem;" data-text="whoGuidelines.officialSources.title"></h3>
          <ul style="margin: 0; padding-left: 1.25rem; line-height: 1.8;" id="whoSources"></ul>
        </div>
      </section>

      <!-- Essential Reading -->
      <section class="section" id="essential-reading">
        <h2 data-text="books.title"></h2>
        <p class="section-intro" data-text="books.intro"></p>

        <div class="search-filter-bar">
          <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="bookSearch" class="search-input" data-placeholder="books.searchPlaceholder" data-aria-label="ui.bookSearchLabel">
          </div>
        </div>

        <div class="books-grid" id="booksGrid"></div>
      </section>

      <!-- Key Thinkers -->
      <section class="section" id="key-thinkers">
        <h2 data-text="thinkers.title"></h2>
        <p class="section-intro" data-text="thinkers.intro"></p>
        <div class="authors-grid" id="authorsGrid"></div>
      </section>

      <!-- Research & Publications -->
      <section class="section" id="research">
        <h2 data-text="research.title"></h2>
        <p class="section-intro" data-text="research.intro"></p>

        <div class="callout" style="margin-bottom: 2rem;" data-callout="research.polishCallout"></div>

        <div class="resources-list" id="resourcesList"></div>
      </section>

      <!-- Practical Approaches -->
      <section class="section" id="practical">
        <h2 data-text="practical.title"></h2>
        <p class="section-intro" data-text="practical.intro"></p>
        <div class="practical-grid" id="practicalGrid"></div>
      </section>

      <!-- About & Contact Section -->
      <section class="section" id="about">
        <h2 data-text="about.title"></h2>
        <p class="section-intro" data-text="about.intro"></p>

        <div class="about-box">
          <h3 style="margin-top: 0;" data-text="about.sections.whoWeAre.title"></h3>
          <p data-text="about.sections.whoWeAre.content"></p>

          <h3 data-text="about.sections.mission.title"></h3>
          <p data-text="about.sections.mission.content"></p>

          <div style="margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--border-subtle);">
            <h3 data-text="about.contact.title"></h3>
            <p data-text="about.contact.intro"></p>

            <!-- Netlify Form: must stay in static HTML so Netlify detects it at deploy time -->
            <form name="contact" method="POST" data-netlify="true" netlify class="contact-form">
              <input type="hidden" name="form-name" value="contact" />

              <div class="form-group">
                <label for="contact-name" class="form-label" data-text="about.contact.form.nameLabel"></label>
                <input type="text" id="contact-name" name="name" class="form-input" data-placeholder="about.contact.form.namePlaceholder" required>
              </div>

              <div class="form-group">
                <label for="contact-email" class="form-label" data-text="about.contact.form.emailLabel"></label>
                <input type="email" id="contact-email" name="email" class="form-input" data-placeholder="about.contact.form.emailPlaceholder" required>
              </div>

              <div class="form-group">
                <label for="contact-message" class="form-label" data-text="about.contact.form.messageLabel"></label>
                <textarea id="contact-message" name="message" class="form-textarea" rows="5" data-placeholder="about.contact.form.messagePlaceholder" required></textarea>
              </div>

              <button type="submit" class="btn-submit">
                <span data-text="about.contact.form.submitButton"></span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </form>
          </div>

          <div class="callout" style="margin-top: 2.5rem;" data-callout="about.collaborate"></div>

          <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="font-size: 0.875rem; color: var(--text-subtle);">
              <span data-text="about.footer.lastUpdateLabel"></span> <strong data-text="about.footer.lastUpdateValue"></strong>
            </div>
            <div style="font-size: 0.875rem; color: var(--text-subtle);" data-text="about.footer.location"></div>
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <p data-text="about.footer.copyright"></p>
        <div class="footer-version"><span data-text="about.footer.versionLabel"></span> <span data-text="meta.version"></span></div>
      </footer>

    </div>
  </main>

  <!-- Back to top floating button -->
  <button class="back-to-top" id="backToTop" data-aria-label="ui.backToTop">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <!-- Loads content.json, renders the page, then loads app.js -->
  <script src="render.js"></script>
</body>
</html>
